<script>
    let ids = [
        "img0", "img1", "img2", "img3", "img4", "img5",
        "img6", "img7", "img8", "img9", "img10", "img11",
        "img12", "img13", "img14", "img15", "img16", "img17",
        "img18", "img19", "img20", "img21", "img22", "img23",
        "img24", "img25", "img26", "img27", "img28", "img29",
        "img30", "img31", "img32", "img33", "img34", "img35"
    ];
    let score = 0;
    let locationsVisited = 0;
    let lastLocation = 0;
    let poisonLocation = 19;
    let roseLocation = 14;
    let lilyLocations = [3, 25];
    let daisyLocations = [2, 5, 11, 20, 21];
    let gameOver = false;

    function check(position) {
        if (gameOver) {
            return;
        }

        let imgId = ids[position];
        let imgElement = document.getElementById(imgId);

        if (position === poisonLocation) {
            imgElement.src = "poison ivy.jpg";
            score = score - 4;
            gameOver = true;
        } else if (position === roseLocation) {
            imgElement.src = "rose.jpg";
            score = score + 4;
        } else if (lilyLocations.includes(position)) {
            imgElement.src = "lily.jpg";
            score = score + 2;
        } else if (daisyLocations.includes(position)) {
            imgElement.src = "daisy.jpeg";
            score = score + 1;
        } else {
            imgElement.src = "bush.jpg";
        }

        locationsVisited = locationsVisited + 1;
        lastLocation = position;

        document.getElementById("locations").innerHTML = "Number of locations checked is " + locationsVisited + ".";
        document.getElementById("score").innerHTML = "Score is " + score + ".";
    }

    function help() {
        let fourClosest = [
            (lastLocation + 1) % 36,
            (lastLocation - 1 + 36) % 36,
            (lastLocation + 6) % 36,
            (lastLocation - 6 + 36) % 36
        ];

        for (let i = 0; i < fourClosest.length; i = i + 1) {
            if (daisyLocations.includes(fourClosest[i])) {
                document.getElementById("help").innerHTML = "cold";
                return "cold";
            }
        }

        let lastRow = Math.floor(lastLocation / 6);
        let lastCol = lastLocation % 6;
        let nineNeighbors = [];

        for (let r = lastRow - 1; r <= lastRow + 1; r = r + 1) {
            for (let c = lastCol - 1; c <= lastCol + 1; c = c + 1) {
                if (r >= 0 && r < 6 && c >= 0 && c < 6) {
                    nineNeighbors.push(r * 6 + c);
                }
            }
        }

        if (nineNeighbors.includes(roseLocation)) {
            document.getElementById("help").innerHTML = "hot";
            return "hot";
        }

        if (nineNeighbors.includes(poisonLocation)) {
            document.getElementById("help").innerHTML = "watch out";
            return "watch out";
        }

        document.getElementById("help").innerHTML = "warm";
        return "warm";
    }
</script>
